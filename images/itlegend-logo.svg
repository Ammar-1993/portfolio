<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <style>
    .title { font-family: 'Arial Black', Impact, sans-serif; font-size: 32px; fill: #212c4f; font-weight: 900; letter-spacing: 1px;}
    .subtitle { font-family: Arial, sans-serif; font-size: 11px; fill: #e67e22; font-weight: bold; letter-spacing: 1.5px; text-transform: lowercase; }
  </style>

  <g transform="translate(100, 45)">
    <!-- Crown -->
    <path d="M-15,-15 L-25,-32 L-8,-22 L0,-40 L8,-22 L25,-32 L15,-15 Z" fill="#212c4f"/>
    <path d="M-15,-15 C-15,-5 15,-5 15,-15 Z" fill="#212c4f"/>
    <circle cx="0" cy="-40" r="2.5" fill="#212c4f" />
    <circle cx="-25" cy="-32" r="2" fill="#212c4f" />
    <circle cx="25" cy="-32" r="2" fill="#212c4f" />
    
    <!-- Crown inner code -->
    <path d="M-3,-22 L-6,-25 L-3,-28 M3,-22 L6,-25 L3,-28" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left Brace Shield -->
    <path d="M-15,0 C-40,0 -40,25 -50,30 C-40,35 -40,60 -15,60 C-15,75 -5,85 0,95" 
          fill="none" stroke="#212c4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Brace Shield -->
    <path d="M15,0 C40,0 40,25 50,30 C40,35 40,60 15,60 C15,75 5,85 0,95" 
          fill="none" stroke="#212c4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Top Connector -->
    <path d="M-15,0 L15,0" fill="none" stroke="#212c4f" stroke-width="7" stroke-linecap="round" />

    <!-- Code inside shield -->
    <path d="M-12,20 L-25,30 L-12,40" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5,15 L-5,45" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round"/>
    <path d="M12,20 L25,30 L12,40" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Orange Chevron -->
    <path d="M-28,95 L0,118 L28,95" fill="none" stroke="#e67e22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-15,110 L0,123 L15,110" fill="none" stroke="#e67e22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="100" y="195" class="title" text-anchor="middle">IT LEGEND</text>
  <text x="100" y="215" class="subtitle" text-anchor="middle">For an exceptional career</text>
</svg>
