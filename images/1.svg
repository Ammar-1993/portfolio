<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Taiz University Logo">
  <defs>
    <radialGradient id="outerRing" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c8d8e8"/>
      <stop offset="60%" stop-color="#9ab0c8"/>
      <stop offset="100%" stop-color="#7090aa"/>
    </radialGradient>
    <radialGradient id="innerBg" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6ab4e0"/>
      <stop offset="50%" stop-color="#2a80c0"/>
      <stop offset="100%" stop-color="#185090"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="100%" stop-color="#f5c400"/>
    </radialGradient>
    <clipPath id="archClip">
      <path d="M55,140 L55,80 Q55,52 100,48 Q145,52 145,80 L145,140 Z"/>
    </clipPath>
  </defs>

  <!-- Outer metallic ring -->
  <circle cx="100" cy="100" r="98" fill="url(#outerRing)" stroke="#b0bec8" stroke-width="1"/>
  <!-- Inner blue background -->
  <circle cx="100" cy="100" r="85" fill="url(#innerBg)"/>

  <!-- Arch shape (gate/mosque silhouette) -->
  <path d="M52,145 L52,85 Q52,48 100,44 Q148,48 148,85 L148,145 Z"
        fill="#1060a0" opacity="0.5"/>
  <path d="M57,145 L57,86 Q57,54 100,50 Q143,54 143,86 L143,145 Z"
        fill="none" stroke="#a0c8e8" stroke-width="1.5"/>

  <!-- Sun/circle at top of arch -->
  <circle cx="100" cy="68" r="16" fill="url(#sunGrad)" stroke="#d4a000" stroke-width="1.5"/>
  <!-- Book icon inside sun -->
  <rect x="93" y="63" width="14" height="10" rx="1" fill="#1a3a6a"/>
  <line x1="100" y1="63" x2="100" y2="73" stroke="#6ab4e0" stroke-width="1.2"/>

  <!-- Sun rays -->
  <g stroke="#f5c400" stroke-width="1.2" opacity="0.9">
    <line x1="100" y1="50" x2="100" y2="44"/>
    <line x1="111" y1="53" x2="115" y2="48"/>
    <line x1="118" y1="62" x2="124" y2="59"/>
    <line x1="89" y1="53" x2="85" y2="48"/>
    <line x1="82" y1="62" x2="76" y2="59"/>
    <line x1="78" y1="74" x2="72" y2="73"/>
    <line x1="122" y1="74" x2="128" y2="73"/>
  </g>

  <!-- Minaret (left) -->
  <rect x="64" y="105" width="10" height="38" fill="#e8f4ff" opacity="0.9"/>
  <polygon points="64,105 69,94 74,105" fill="#c8e0f4"/>
  <rect x="66" y="108" width="6" height="3" fill="#8ab4d0"/>
  <rect x="66" y="114" width="6" height="3" fill="#8ab4d0"/>
  <rect x="66" y="120" width="6" height="3" fill="#8ab4d0"/>

  <!-- Atom symbol (center) -->
  <g transform="translate(100,118)" stroke="#80c4f0" fill="none" stroke-width="1.4">
    <ellipse rx="15" ry="7" transform="rotate(0)"/>
    <ellipse rx="15" ry="7" transform="rotate(60)"/>
    <ellipse rx="15" ry="7" transform="rotate(120)"/>
    <circle r="3" fill="#a0d8ff" stroke="none"/>
  </g>

  <!-- Dome-style building base -->
  <rect x="78" y="130" width="44" height="13" rx="1" fill="#c8dff0" opacity="0.85"/>
  <rect x="82" y="126" width="36" height="5" rx="1" fill="#b0d0e8"/>

  <!-- Yellow banner -->
  <rect x="56" y="143" width="88" height="16" rx="3" fill="#f5c400"/>
  <!-- Arabic text: جامعة تعز -->
  <text x="100" y="154" font-family="Arial, sans-serif" font-size="7" font-weight="bold"
        fill="#1a3a6a" text-anchor="middle">جامعة تعز</text>

  <!-- Latin text: TAIZ UNIVERSITY -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="5.5" font-weight="600"
        fill="#e8f4ff" text-anchor="middle" letter-spacing="0.5">TAIZ UNIVERSITY</text>

  <!-- Years: 1414 / 1993 -->
  <text x="67" y="165" font-family="Arial, sans-serif" font-size="4.5"
        fill="#c0d8f0" text-anchor="middle">1414</text>
  <text x="133" y="165" font-family="Arial, sans-serif" font-size="4.5"
        fill="#c0d8f0" text-anchor="middle">1993م</text>
</svg>
